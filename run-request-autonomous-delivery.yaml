schemaVersion: 1
runId: ad-fresh-probe-001

target:
  # address and user are omitted here and will be loaded from .env (TARGET_HOST_IP and TARGET_HOST_USER)
  hostKeySha256: "SHA256:lm8QcfqbnK4aeSLVofPsHOuqnyComJTVYrcSarU9PNQ"
  sshPrivateKeyFileEnv: HAIFA_EVAL_HOST_SSH_KEY_FILE
  requirePasswordlessSudo: true

source:
  githubPrivateKeyFileEnv: HAIFA_EVAL_GITHUB_SSH_KEY_FILE
  repositories:
    product:
      url: git@github.com:haifa-agent/haifa-agent.git
      branch: dev
    docs:
      url: git@github.com:haifa-agent/haifa-agent-internal-docs.git
      branch: main
    testConfig:
      url: git@github.com:haifa-agent/haifa-agent-test-config.git
      branch: main

evaluation:
  kind: haifa-harness
  providerId: zhipu
  modelId: glm-5.3-flash
  agentProfileRef: coding-zhipu-glm53-flash
  requiredSecretEnvironmentNames:
    - BIGMODEL_API_KEY
    - ALIYUN_IQS_API_KEY
  runs:
    - id: ad-phase-1
      suite: autonomous-delivery-phase-1-v1
      platform: linux-host-default
      approveBudget: "900"
      reportRole: formal
    - id: ad-phase-2
      suite: autonomous-delivery-phase-2-v1
      platform: linux-host-default
      approveBudget: "450"
      reportRole: formal
    - id: ad-phase-3
      suite: autonomous-delivery-phase-3-v1
      platform: linux-host-default
      approveBudget: "2550"
      reportRole: formal

output:
  remoteEvidenceRoot: /var/lib/haifa-eval/evidence
  localResultRoot: D:/haifa-agent-eval-results
  retainRemoteEvidenceAfterPull: true
